services:
  energy-forecast-proxy:
    image: ghcr.io/mastr/energyforecast_proxy:latest
    restart: unless-stopped
    # Simple-Modus: Konfiguration über Umgebungsvariablen.
    # Wenn ENERGYFORECAST_TOKEN gesetzt ist, sind /simple/prices und /simple/current
    # ohne Query-Parameter nutzbar.
    environment:
      # --- Pflicht ---
      ENERGYFORECAST_TOKEN: "dein-token"

      # --- Marktzone ---
      # ENERGYFORECAST_MARKET_ZONE: "DE-LU"   # Marktzone (DE/LU -> DE-LU, AT, FR, NL, BE, ...; Standard: DE-LU)

      # --- Zeithorizont & Auflösung ---
      # ENERGYFORECAST_HORIZON: "0"            # Max. Stunden zurückgeben; 0 = alle verfügbaren Daten (Standard: 0)
      # ENERGYFORECAST_RESOLUTION: "hourly"    # hourly (Stunden-Aggregation) oder quarter_hourly (native 15-min; Standard: hourly)
      # ENERGYFORECAST_USE_TOTAL_PRICE: "false" # true: API-seitig berechneten Gesamtpreis nutzen (ignoriert lokale Kosten)

      # --- Preisberechnung ---
      # Formel: (spot + fixed_net_cost + markup_costs + fixed_cost_other) × (1 + vat)
      # ENERGYFORECAST_FIXED_NET_COST: "0.08"  # Netzgebühren in EUR/kWh
      # ENERGYFORECAST_MARKUP_COSTS: "0.01"    # Anbieter-Aufschlag in EUR/kWh (z. B. 1 ct/kWh)
      # ENERGYFORECAST_FIXED_COST_OTHER: "0.0" # Sonstige Fixkosten in EUR/kWh
      # ENERGYFORECAST_VAT: "0.19"             # MwSt. als Faktor (0.19) oder Prozent (19)
      # ENERGYFORECAST_PRICE_CAP: ""           # Preisobergrenze in EUR/kWh brutto (nach Steuern & Gebühren, optional)

      # --- Cache & Ausgabe ---
      # ENERGYFORECAST_CACHE_TTL: "60"         # Cache-Gültigkeit in Minuten (Standard: 60)
      # ENERGYFORECAST_RESULT_FORMAT: "evcc"   # default oder evcc (Standard: default)
      # ENERGYFORECAST_TZ: "Europe/Berlin"     # Ausgabe-Zeitzone (IANA, optional)

      # --- Dynamische Netzgebühren (§14a EnWG) ---
      # Wenn ENERGYFORECAST_DYN_NET_OPERATOR gesetzt ist, werden zeitvariable Netzgebühren
      # von der dynamic_energy_fees API abgerufen und ersetzen ENERGYFORECAST_FIXED_NET_COST.
      # Verfügbare Netzbetreiber: https://mastr.github.io/dynamic_energy_fees
      # ENERGYFORECAST_DYN_NET_OPERATOR: "syna"  # Netzbetreiber-ID (z. B. syna, bayernwerk, e-netz-suedhessen)
      # ENERGYFORECAST_DYN_NET_COUNTRY: "de"     # Ländercode (Standard: de)
      # ENERGYFORECAST_DYN_NET_API_URL: ""       # Nur bei Self-Hosting der dynamic_energy_fees-Instanz nötig
    ports:
      - "8000:8000"
    # Beispiel: Traefik-Integration (Labels nach Bedarf anpassen)
    # networks:
